name: Qualité du portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Vérifier les nouveaux messages de commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-commits.mjs "$BASE_SHA..$HEAD_SHA"
          fi
      - name: Construire et vérifier le site
        run: npm run publish:prepare
      - name: Vérifier que docs correspond aux sources
        run: |
          git diff --exit-code -- docs
          test -z "$(git ls-files --others --exclude-standard docs)"
